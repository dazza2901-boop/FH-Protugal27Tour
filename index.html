<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>⛳ Portugal 2027</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Header -->
  <header id="app-header">
    <div class="header-inner">
      <span id="header-title">⛳ Portugal 2027</span>
      <button id="admin-btn" class="btn-icon" title="Admin">⚙️</button>
    </div>
    <nav id="main-nav">
      <button class="nav-btn active" data-page="scoreboard">🏆 Leaderboard</button>
      <button class="nav-btn" data-page="scorecard">📝 Scores</button>
      <button class="nav-btn" data-page="schedule">📅 Schedule</button>
      <button class="nav-btn admin-only hidden" data-page="players">👤 Players</button>
      <button class="nav-btn admin-only hidden" data-page="teams">🏌️ Teams</button>
    </nav>
  </header>

  <!-- Main content area -->
  <main id="app-main">
    <div id="loading" class="center-msg">Loading…</div>
  </main>

  <!-- Admin PIN modal -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-box">
      <h3>Admin Access</h3>
      <p>Enter PIN to unlock admin features</p>
      <input type="password" id="admin-pin-input" maxlength="6" placeholder="PIN" />
      <div class="modal-actions">
        <button id="admin-pin-cancel" class="btn-secondary">Cancel</button>
        <button id="admin-pin-confirm" class="btn-primary">Unlock</button>
      </div>
      <p id="admin-pin-error" class="error hidden">Incorrect PIN</p>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- Firebase SDK (compat v9) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- App modules -->
  <script src="js/firebase.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/players.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/scorecard.js"></script>
  <script src="js/scoreboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
